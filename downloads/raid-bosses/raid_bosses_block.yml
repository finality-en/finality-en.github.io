
  # ==========================================================================================
  #  RAID BOSSES - manual spawn only (never scheduled). /fboss menu or /fboss spawn <id> [here]
  #  They spawn at their own spawn point if you set one (/fboss setspawn <id>), otherwise at the
  #  Evil Elf's warzone spawn. Warzone PvP turns OFF while one is alive (same as the Elf).
  #  Health over 2048 works even with spigot.yml's cap (damage gets scaled to match).
  #  Every ability: abilities.<name>.weight (0 = off), .damage, .cooldown-ticks
  #  Rewards support 'chance N <command>' (e.g. 'chance 25 fboss item krampus_chain {player}').
  # ==========================================================================================
  krampus:
    display-name: '&4&lKrampus'
    icon: WITHER_SKELETON_SKULL
    health: 2600
    scale: 1.7
    movement-speed: 0.28
    knockback-resistance: 0.9
    invulnerability-ticks: 10
    max-damage-per-hit: 30
    mace: no-smash
    mace-max-damage: 9
    damage-to-players-multiplier: 1.0
    leash-radius: 40
    idle-despawn-seconds: 300
    ability-interval-ticks: 60-100
    melee: {damage: 13, reach: 3.0, cooldown-ticks: 20, knockback: 0.6}
    enrage: {at-percent: 30, damage-multiplier: 1.3, speed-bonus: 0.25, ability-interval-ticks: 40-70}
    abilities:
      chain-hook: {weight: 25, damage: 6, range: 22}
      naughty-list: {weight: 20, damage: 14, targets: 2, delay-ticks: 50}
      coal-barrage: {weight: 20, damage: 6}
      switch-flurry: {weight: 18, damage: 7}
      imps: {weight: 12, count: 3, health: 8, max-alive: 6}
      sack-slam: {weight: 15, damage: 10}
      fire-aura: {damage: 2}
    sidebar: {title: '&4&lKRAMPUS', range: 64}
    bossbar: {text: '{name} &8| &c{hp}&7/&c{max} ❤'}
    messages:
      spawn: '{name} &7has come for the &cnaughty&7! &7Warzone below spawn - &aPvP is OFF&7 until he dies!'
      spawn-title: '&4&lKRAMPUS'
      spawn-subtitle: '&7Raid boss - bring your team'
      enrage: '{name} &c&lis ENRAGED! &7He''s on fire!'
    discord:
      spawn-boss: "⛓️ **RAID BOSS: KRAMPUS HAS BEEN SUMMONED!**\nHe's in the **warzone below spawn** - PvP is **OFF** there until he dies. Chain hooks, hellfire marks and imps. Bring your best gear!"
      spawn-chat: "⛓️ **Krampus has been summoned in the warzone!** PvP is off there until he's dead."
      kill-boss: "💀 **KRAMPUS HAS BEEN DEFEATED!**"
    chests:
      ring-count: 5
      radius: 4
      center-chest: true
      ring-name: '&4&lKrampus'' Sack'
      center-name: '&c&lNaughty Hoard'
      despawn-seconds: 60
      guaranteed:
        - {crate-key: finality, amount: 1}
      spread:
        - {boss-item: krampus_chain, amount: 1, count: 1, chance: 25}
        - {repair-voucher: true, amount: 1, count: 2, chance: 35}
    rewards:
      rank:
        1: ['ac key give {player} finality 2', 'ac key give {player} relic 1', 'coins give {player} 350', 'chance 20 fboss item krampus_chain {player}']
        2: ['ac key give {player} finality 2', 'coins give {player} 250']
        3: ['ac key give {player} finality 1', 'coins give {player} 175']
      participation-min-percent: 2
      participation: ['coins give {player} 50', 'minecraft:xp add {player} 5000 points']

