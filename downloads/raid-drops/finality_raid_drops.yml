# Raid boss drops. Powers + stats come from FinalityBosses (config.yml -> boss-items).
# A copy from /nexo give or the Nexo menu turns into the real item (with its powers) as soon as
# it's held, picked up or the inventory is opened. The lore here is only for the Nexo menu - the real
# numbers live in FinalityBosses/config.yml (boss-items), so update both if you change them. /fboss item <id> [player] gives the real one directly.
# The swords are Elf Candy Cane variants; Yeti Hide is a reskinned Glacier Chestplate.
krampus_chain:
