  # ============================================================
  #  FROST KING - easy PvP boss. Warzone PvP stays ON the whole fight.
  #  Kill him -> his Crown drops -> hold it for 60s in a row to win.
  #  /fboss spawn frost_king   |   /fboss setspawn frost_king
  # ============================================================
  frost_king:
    display-name: '&b&lFrost King'
    pvp: true                    # PvP boss: no warzone lockdown
    spawn:
      world: world
      x: 0.5
      y: 63
      z: 0.5
    leash-radius: 40
    idle-despawn-seconds: 300
    idle-range: 48
    health: 2000
    scale: 2.8                   # how big he is (snow golem x2.8)
    movement-speed: 0.26
    knockback-resistance: 0.75
    max-damage-per-hit: 35
    damage-multiplier: 1.0       # scale players' damage TO him
    invulnerability-ticks: 10
    ability-interval-ticks: '70-110'
    # All damage below is before armour. Enraged (under 30% HP) multiplies it by enrage.damage-multiplier.
    punch:                       # anyone in arm's reach gets smacked + knocked back + Slowness II
      reach: 3.4
      damage: 8
      knockback: 1.1
      cooldown-ticks: 24
    aura:                        # standing close chills you every second
      radius: 4.5
      damage: 2
    barrage:                     # snowball volleys at up to 4 players, every hit stings + slows
      max-targets: 4
      snowballs: 8
      damage: 3.5
    ice-slam:                    # jumps and slams, launching everyone close (blue ring = warning)
      radius: 7
      damage: 10
      push: 0.9
      launch: 1.0
      jump: 1.0
    snowlings:                   # mini snowmen that chase you, bite, and burst into frost when they die
      count: 4
      max-alive: 6
      health: 12
      scale: 0.55
      speed: 0.34
      bite-damage: 3.5
      bite-reach: 1.8
      bite-cooldown-ticks: 16
      burst-damage: 4
      burst-radius: 2.8
      life-seconds: 25
      name: '&fSnowling'
    icicle-rain:                 # marked circles under players, icicles land after the warning
      per-player: 2
      max-spots: 12
      warning-ticks: 25
      radius: 1.8
      damage: 9
    ice-prison:                  # freezes the furthest player in a block of ice
      seconds: 2.5
      shatter-damage: 5
    avalanche:                   # telegraphed charge (blue line) that bowls over everyone in its path
      windup-ticks: 22
      speed: 1.1
      hit-radius: 2.6
      damage: 9
      max-ticks: 30
    whiteout:                    # at 66% and 33% HP: roar, then a shockwave ring - JUMP over it
      health-triggers: [66, 33]
      roar-ticks: 30
      radius: 16
      speed: 0.7
      damage: 12
    enrage:
      at-percent: 30
      damage-multiplier: 1.25
      speed-bonus: 0.25
      ability-interval-ticks: '45-75'
    sidebar:
      title: '&b&lFROST KING'
      range: 64
    bossbar:
      text: '{name} &8| &b{hp}&7/&b{max} ❤ &8| &cPvP ON'
    floor-loot:
      max-items: 18              # rolled from loot.yml -> frost_king.floor, spills on the floor
    crown:
      hold-seconds: 60           # hold it this long IN A ROW to win
      max-seconds: 300           # nobody manages it in 5 min -> it melts
      arena-radius: 45           # leave this radius (from the spawn point) and it goes back to the middle
      view-radius: 150           # these players see the holder's location on the action bar
      kill-on-logout: true       # logging out with the crown = combat log (if PvPManager didn't already)
    rewards:
      crown:                     # whoever holds the crown for 60s
        - 'ac key give {player} finality 2'
        - 'coins give {player} 300'
        - 'challenge give {player} glacial_shard 2'
        - 'challenge voucher give {player} frost_voucher 1'
        - 'chance 25 ac key give {player} relic 1'
      killing-blow:
        - 'coins give {player} 100'
        - 'challenge give {player} glacial_shard 1'
    messages:
      spawn: '{name} &7has appeared in the &cwarzone below spawn&7! &c&lPvP IS ON&7. Kill him and fight for his &b&lCROWN&7!'
      spawn-title: '&b&lFROST KING'
      spawn-subtitle: '&7PvP boss in the warzone - fight for the crown!'
      enrage: '{name} &c&lis ENRAGED! &7He hits harder and faster!'
    schedule:
      enabled: true
      boss: frost_king
      timezone: Europe/London
      times: ['11:00', '15:00', '21:00', '00:30']
      days: []
      min-players: 0
      pre-spawn:
        enabled: true
        seconds: 60
        commands: ['clearblocks', 'ar regen warzone']
      countdown-minutes: [10, 5, 1]
      countdown-seconds: [5, 4, 3, 2, 1]
      discord-countdown-minutes: [10]
      banner: banner_frost_king.png
      messages:
        title: '&b&lFROST KING'
        title-1min: '&7spawns in &e1 minute &7- &cPvP stays ON&7!'
        incoming: '&b&lFrost King &7incoming... &cPvP ON'
        countdown-minutes: '&b&lFrost King &7spawns in the &cwarzone &7in &e&l{m} {unit}&7! &cPvP stays ON &7- fight for his crown!'
        pre-spawn: '&b&lFROST KING INCOMING &7- the warzone has been cleared. &c&lPvP STAYS ON&7. Kill him, grab the crown, hold it for 60s!'
        skipped: '&7Not enough players online - the Frost King stays home.'
      discord:
        timer-message: true
        timer-template: "# 👑 The Frost King\n{status}\n-# PvP boss · kill him, then hold his crown for 60s to win · {schedule}"
        timer-alive: "## 🔴 LIVE RIGHT NOW\nThe Frost King (or his crown) is in the warzone. **PvP is ON.**"
        countdown: "⏰ **The Frost King spawns in {m} {unit}!** PvP stays on — kill him and fight for the crown."
        spawn-boss: "👑 **THE FROST KING HAS SPAWNED!**\nHe's in the warzone below spawn. **PvP is ON** — kill him, grab his crown and hold it for 60 seconds to win."
        spawn-chat: "👑 **The Frost King has spawned in the warzone!** PvP is on — fight for his crown."
        despawn: "💨 The Frost King melted away without being defeated."
